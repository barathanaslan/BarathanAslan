/* Layout: one screen, everything drawn in code with pen, ink and coloured pencil; each step plays by itself and holds; typed words sit under the drawing. */
:root {
  --night: #141b38;   /* the paper, inked dark blue */
  --night2: #22306a;  /* lighter blue pencil */
  --night3: #090d24;  /* darkest ink */
  --ink: #efe3c4;     /* cream ink: stars, lines, words */
  --blue: #8ea6dc;    /* blue ballpoint */
  --coral: #e2775c;   /* roads */
  --sand: #c9a46a;    /* land, ochre pencil */
  --sand2: #e6cb93;
  --sea: #9cc0e6;     /* the sea bus */
  --type: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: var(--night); }
body {
  margin: 0; color: var(--ink); font-family: var(--type);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.grain { position: fixed; inset: -40%; pointer-events: none; opacity: .13; mix-blend-mode: overlay; animation: grain 1.6s steps(4) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } }
.poem {
  position: fixed; pointer-events: none; text-align: center;
  left: max(24px, calc(env(safe-area-inset-left, 0px) + 18px));
  right: max(24px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
}
.poem-top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 7vh); }
.poem p {
  margin: 0 auto; max-width: 26ch;
  font-size: clamp(19px, 5.1vw, 30px); line-height: 1.38; letter-spacing: -.01em;
  color: var(--ink); text-wrap: balance;
  text-shadow: 0 0 14px var(--night3), 0 0 2px var(--night3);
  opacity: 0; transition: opacity 1.4s ease;
}
.poem p.on { opacity: 1; }
.poem p + p { margin-top: .5em; }
.poem p.last { font-weight: 700; font-size: clamp(26px, 7.4vw, 44px); margin-top: .45em; }
.poem.out p { opacity: 0; transition: opacity .4s ease; }
.next {
  position: fixed; left: 50%; width: 1px; height: 22px; margin-left: -.5px; pointer-events: none;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--ink); opacity: 0; transform-origin: top; transition: opacity 1.2s ease;
}
.next.on { opacity: .45; animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@media (min-aspect-ratio: 23/20) {
  .poem { right: auto; width: 35vw; left: 5vw; bottom: 12vh; text-align: left; }
  .poem-top { bottom: auto; top: 12vh; }
  .poem-top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 7vh); }
.poem p { margin: 0; }
}
/* the music player: invisible; only if the phone won't start it, a small ♪ shows and a tap on it starts the player itself */
.yt {

}
.yt span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; color: var(--ink); }
.yt iframe { position: absolute; left: -77px; top: -77px; width: 200px; height: 200px; border: 0; opacity: .01; }
.yt.ask { opacity: .85; pointer-events: auto; animation: ask 2.4s ease-in-out infinite; }
@keyframes ask { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .grain, .next.on, .yt.ask { animation: none; } }
noscript { position: fixed; inset: 40% 16px auto; color: var(--ink); text-align: center; }

    const spots = photoSpots();
    ["kedi-1", "kedi-2"].forEach((key, i) => {
      const img = new Image();
      img.onload = () => {
        const sp = spots[i], w = sp.w, h = w * (img.height / img.width);
        const pad = w * 0.42, cw = w + pad * 2, ch = h + pad * 2;
        const c = document.createElement("canvas");
        c.width = Math.round(cw * DPR); c.height = Math.round(ch * DPR);
        const x = c.getContext("2d");
        x.setTransform(DPR, 0, 0, DPR, 0, 0); x.lineCap = "round";
        // a dark crown around the picture, shaded like the others
        const rr = rng(40 + i), pts = [];
        for (let k = 0; k <= 180; k++) {
          const th = (k / 180) * TAU, sc = 9;
          const rad = 1 + 0.06 * Math.abs(Math.sin((sc * th) / 2 + i)) + 0.03 * Math.sin(3 * th + i);
          pts.push([cw / 2 + Math.cos(th) * (cw / 2 - 6) * rad * 0.94, ch / 2 + Math.sin(th) * (ch / 2 - 6) * rad * 0.94]);
        }
        const blob = new Path2D(); pts.forEach((q, k) => (k ? blob.lineTo(q[0], q[1]) : blob.moveTo(q[0], q[1]))); blob.closePath();
        x.fillStyle = rgba(C.night3, 1); x.fill(blob);
        x.save(); x.clip(blob);
        hatch(x, [0, 0, cw, ch], { seed: 50 + i, angle: 0.85, gap: 2.6, len: [4, 10], space: 3, width: 0.9, colors: [C.blue], alpha: [0.18, 0.3, 0.42] });
        x.restore();
        pen(x, pts, { color: C.blue, width: 1.2, alpha: 0.85, amp: 0.8, seed: 7 + i });
        // the photograph, printed in the two inks of the page
        const tmp = document.createElement("canvas");
        tmp.width = Math.round(w * DPR); tmp.height = Math.round(h * DPR);
        const tx = tmp.getContext("2d");
        tx.drawImage(img, 0, 0, tmp.width, tmp.height);
        const d = tx.getImageData(0, 0, tmp.width, tmp.height), px = d.data;
        const lo = [16, 22, 52], mid = [92, 104, 150], hi = C.ink;
        for (let k = 0; k < px.length; k += 4) {
          const L = Math.pow((0.299 * px[k] + 0.587 * px[k + 1] + 0.114 * px[k + 2]) / 255, 0.95);
          const [A, B, f] = L < 0.5 ? [lo, mid, L * 2] : [mid, hi, (L - 0.5) * 2];
          for (let ch2 = 0; ch2 < 3; ch2++) px[k + ch2] = A[ch2] + (B[ch2] - A[ch2]) * f;
        }
        tx.putImageData(d, 0, 0);
        const frame = new Path2D();
        const fr = Math.min(w, h) * 0.08;
        frame.roundRect ? frame.roundRect(pad, pad, w, h, fr) : frame.rect(pad, pad, w, h);
        x.save(); x.clip(frame); x.drawImage(tmp, pad, pad, w, h); x.restore();
        pen(x, [[pad + fr, pad], [pad + w - fr, pad], [pad + w, pad + fr], [pad + w, pad + h - fr], [pad + w - fr, pad + h], [pad + fr, pad + h], [pad, pad + h - fr], [pad, pad + fr], [pad + fr, pad]], { color: C.ink, width: 1.1, alpha: 0.8, amp: 0.6, seed: 3 + i });
        photoArt[i] = { c, cw, ch, sp };
      };
      img.src = PHOTO_SRC[key];
    });
  }
  function drawPhotos(a, pan, now) {
    if (a <= 0) return;
    photoArt.forEach((p, i) => {
      if (!p) return;
      const bob = reduce ? 0 : Math.sin(now * 0.6 + i * 2) * 2.5;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.sp.x, p.sp.y - pan + bob);
      ctx.rotate(p.sp.tilt + (reduce ? 0 : Math.sin(now * 0.4 + i) * 0.01));
      ctx.drawImage(p.c, -p.cw / 2, -p.ch / 2, p.cw, p.ch);
      ctx.restore();
    });
  }

  const poem = $("#poem"), poemTop = $("#poemTop"), next = $("#next");
  let step = -1, prev = null, prevAge = 0, t0 = 0, switched = 0, swap = null, lineEls = [], gatherRot = 0;
  function go(i, now, at = 0) {
    i = i >= STEPS.length ? 0 : clamp(i, 0, STEPS.length - 1);
    if (i === step) return;
    prev = step >= 0 ? STEPS[step].scene : null;
    // the scene being left keeps its own clock while it fades, so nothing jumps
    prevAge = step >= 0 ? now - t0 : 0;
    if (prev === "sky") gatherRot = reduce ? 0 : now * 0.0045;
    switched = now;
    step = i;
    t0 = now - at;
    poem.classList.add("out"); poemTop.classList.add("out");
    swap = { at: now + (lineEls.length ? 0.4 : 0) };
    next.classList.remove("on");
  }
  function updatePoem(now) {
    const S = STEPS[step];
    if (swap && now >= swap.at) {
      poem.classList.remove("out"); poemTop.classList.remove("out");
      poem.textContent = ""; poemTop.textContent = "";
      // over the park the words sit just above the trees
      poem.style.bottom = S.scene === "sky" || S.scene === "end" ? `${Math.round(H - treeTop + 14)}px` : "";
      lineEls = S.lines.map(([text, at, cls, where]) => {
        const p = document.createElement("p");
        p.textContent = text;
        if (cls) p.className = cls;
        (where === "top" ? poemTop : poem).appendChild(p);
        return { el: p, due: t0 + (reduce ? 0 : at) };
      });
      swap = null;
    }
    for (const l of lineEls) if (now >= l.due) l.el.classList.add("on");
    next.classList.toggle("on", now - t0 >= (reduce ? 0.5 : S.dur));
  }

  function render(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    const s = reduce ? 99 : now - t0;
    const cur = STEPS[step].scene;
    // the near map and the far map are one drawing: no crossfade between them
    // these scenes hand over to each other themselves: no crossfade
    const joined = (prev === "map" && cur === "globe") || (prev === "globe" && cur === "cat") || (prev === "cat" && cur === "end");
    const k = prev && !joined ? ease(clamp((now - switched) / XF)) : 1;
    if (k < 1) scene(prev, prevAge + (now - switched), now, 1 - k);
    scene(cur, s, now, k);
  }

  function resize() {
    gather = null;
    sprites = new Map();
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    wide = W > H * 1.15;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    buildBackground();
    layoutSky();
    cams = { near: camFor([22.8, 36.3, 39.8, 43.0]), far: camFor([0.8, 35.2, 45.0, 44.6]) };
    mapHi = null;
    mapScale();
    buildGlobe();
    buildPhotos();
  }
  (function grain() {
    const g = document.createElement("canvas");
    g.width = g.height = 160;
    const c = g.getContext("2d"), img = c.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    c.putImageData(img, 0, 0);
    $("#grain").style.backgroundImage = `url(${g.toDataURL()})`;
  })();

  function frame(ms) {
    const now = ms / 1000;
    updatePoem(now);
    render(now);
    requestAnimationFrame(frame);
  }

  // =====================================================================  music
  // fallback only: a music box over a soft pad, D major, played live, if the recording can't load
  let audio = null;
  function startSynth() {
    if (audio) { if (audio.ac.state === "suspended") audio.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain();
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 4);
    master.connect(ac.destination);
    const rev = ac.createConvolver(), len = Math.floor(ac.sampleRate * 3.4);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
    rev.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.6; rev.connect(wet); wet.connect(master);
    const dry = ac.createGain(); dry.gain.value = 0.55; dry.connect(master);
    const bus = ac.createGain(); bus.connect(dry); bus.connect(rev);
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // a soft piano: a few slightly stretched partials, two strings a hair apart, a felt-hammer onset
    function piano(m, t, g) {
      const f0 = hz(m), lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(Math.min(9000, f0 * 9), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(400, f0 * 2.2), t + 2.5);
      lp.connect(bus);
      const amps = [1, 0.42, 0.26, 0.14, 0.08, 0.05], decay = 2.6 + 3.5 * Math.max(0, (72 - m) / 30);
      amps.forEach((amp, i) => {
        const nth = i + 1, f = f0 * nth * Math.sqrt(1 + 0.00035 * nth * nth);
        [-1.5, 1.5].forEach((det) => {
          const o = ac.createOscillator(), e = ac.createGain();
          o.type = "sine"; o.frequency.value = f; o.detune.value = det;
          e.gain.setValueAtTime(0, t);
          e.gain.linearRampToValueAtTime((g * amp) / 2, t + 0.008);
          e.gain.exponentialRampToValueAtTime(0.0001, t + decay / Math.pow(nth, 0.7));
          o.connect(e); e.connect(lp); o.start(t); o.stop(t + decay + 0.1);
        });
      });
    }
    // D, Bm, G, A, then D, F#m, G, A
    const CH = [[50, 54, 57], [47, 50, 54], [43, 47, 50], [45, 49, 52], [50, 54, 57], [42, 45, 49], [43, 47, 50], [45, 49, 52]];
    const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83];
    const beat = 0.62, rnd = rng(77);
    let next = ac.currentTime + 0.3, n = 0, last = 66;
    function schedule() {
      while (next < ac.currentTime + 0.5) {
        const bar = Math.floor(n / 8), chord = CH[bar % CH.length], pos = n % 8;
        // left hand: a low root, then the chord broken gently upward
        if (pos === 0) piano(chord[0] - 12, next, 0.2);
        if (pos === 2) piano(chord[1], next, 0.1);
        if (pos === 4) piano(chord[2], next, 0.1);
        if (pos === 6) piano(chord[1] + 12, next, 0.08);
        const busy = 0.35 + 0.08 * Math.max(0, step);
        if (rnd() < (pos % 2 ? busy * 0.6 : busy)) {
          // walk the melody near the last note, leaning on the chord
          const tones = SCALE.filter((m) => Math.abs(m - last) <= 5 && m !== last);
          let m = tones[Math.floor(rnd() * tones.length)] || 69;
          if (pos === 0) m = chord.map((c) => c + 24).reduce((a, c) => (Math.abs(c - last) < Math.abs(a - last) ? c : a));
          last = m;
          piano(m + (step === STEPS.length - 1 && rnd() < 0.25 ? 12 : 0), next, 0.17);
        }
        next += beat; n++;
      }
    }
    const timer = setInterval(schedule, 60);
    schedule();
    document.addEventListener("visibilitychange", () => (document.hidden ? ac.suspend() : ac.resume()));
    audio = { ac, timer };
  }

  // Romantic Flight (John Powell), the official recording through YouTube's own player, looped.
  // It starts on the first touch; if the phone refuses to start it that way, a small ♪ appears
  // in the corner and tapping it starts the player directly.
  // a piano version first; ?v=<id> tries another one
  const qs = new URLSearchParams(location.search);
  const YT_IDS = [qs.get("v"), "_3EgHACPXeo", "78EeFSDYxOs", "FaSeL5hRr_I"].filter(Boolean);
  // the stretch that loops, in seconds (end 0 = to the end of the track); ?bas=40&son=100 overrides, for trying
  const LOOP = { start: +qs.get("bas") || 0, end: +qs.get("son") || 0 };
  const SHOW_TIME = true;
  const ytBox = $("#yt");
  let yt = null, ytReady = false, ytIdx = 0, ytWanted = false, ytState = -1, ytFailed = false, ytAskTimer = 0;
  const ytGoing = () => ytState === 1 || ytState === 3;
  function ytGiveUp() {
    if (ytFailed) return;
    ytFailed = true;
    ytBox.classList.remove("ask");
    if (ytWanted) startSynth();
  }
  const VOL = 45, FADE = 2.5;
  let ytVol = VOL, ytFading = false;
  // fade out before the loop's end, jump back to its start, fade in again; and the time readout
  setInterval(() => {
    if (!yt || !ytReady || ytFailed) return;
    const t = yt.getCurrentTime ? yt.getCurrentTime() : 0, d = yt.getDuration ? yt.getDuration() : 0;
    if (SHOW_TIME) {
      const f = (x) => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`;
      $("#ytTime").textContent = `${f(t)} / ${f(d)}` + (LOOP.end ? `  (döngü ${f(LOOP.start)}–${f(LOOP.end)})` : "");
    }
    if (!ytGoing()) return;
    if (LOOP.end && t >= LOOP.end - FADE && !ytFading) ytFading = true;
    if (ytFading) {
      ytVol = Math.max(0, ytVol - VOL / (FADE * 5));
      yt.setVolume(ytVol);
      if (ytVol <= 0) { yt.seekTo(LOOP.start, true); ytFading = false; }
    } else if (ytVol < VOL) { ytVol = Math.min(VOL, ytVol + VOL / (FADE * 5)); yt.setVolume(ytVol); }
  }, 200);
  function ytArmAsk() {
    clearTimeout(ytAskTimer);
    ytAskTimer = setTimeout(() => {
      if (ytFailed || (ytGoing() && !yt.isMuted())) return;
      // the phone kept it silent: stop, take the mute off, and let a tap on the ♪ (the player itself) start it
      yt.pauseVideo(); yt.unMute(); yt.setVolume(ytVol);
      ytBox.classList.add("ask");
    }, 2500);
  }
  function ytPlay() {
    yt.unMute(); yt.setVolume(ytVol); yt.playVideo();
    ytArmAsk();
  }
  // on arrival: try to play with sound right away; where the browser only allows silent autoplay,
  // the song starts muted so it is already under way, and the first touch turns the sound on
  function ytAutostart() {
    yt.setVolume(ytVol); yt.playVideo();
    setTimeout(() => {
      if (ytWanted || ytFailed) return;
      if (!ytGoing()) { yt.mute(); yt.playVideo(); }
    }, 1200);
  }
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("ytPlayer", {
      width: 200, height: 200, videoId: YT_IDS[0],
      playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, fs: 0, iv_load_policy: 3 },
      events: {
        onReady: () => { ytReady = true; if (LOOP.start) yt.seekTo(LOOP.start, true); if (ytWanted) ytPlay(); else ytAutostart(); },
        onStateChange: (e) => {
          ytState = e.data;
          if (ytGoing()) ytBox.classList.remove("ask");
          if (e.data === 0) { yt.seekTo(LOOP.start, true); yt.playVideo(); }
        },
        onError: () => {
          if (++ytIdx >= YT_IDS.length) return ytGiveUp();
          yt.loadVideoById({ videoId: YT_IDS[ytIdx], startSeconds: LOOP.start });
        },
      },
    });
  };
  {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = ytGiveUp;
    document.head.append(s);
  }
  // if the player hasn't come up 12 s after the first touch, play the fallback instead of silence
  function startMusic() {
    if (ytFailed) return startSynth();
    if (!ytWanted) { ytWanted = true; setTimeout(() => { if (!ytReady) ytGiveUp(); }, 12000); }
    if (!ytReady) return;
    if (!ytGoing()) ytPlay();
    else if (yt.isMuted()) { yt.unMute(); yt.setVolume(ytVol); ytArmAsk(); }
  }
  document.addEventListener("visibilitychange", () => {
    if (!ytReady || ytFailed) return;
    if (document.hidden) yt.pauseVideo(); else yt.playVideo();
  });

  // one gesture, one step
  let lock = 0;
  function advance(dir) {
    const now = performance.now() / 1000;
    if (now < lock) return;
    if (dir > 0 && !reduce && now - t0 < STEPS[step].dur) return;
    lock = now + 0.8;
    go(step + dir, now);
  }
  window.addEventListener("wheel", (e) => {
    e.preventDefault();
    const now = performance.now() / 1000;
    if (now < lock) { lock = Math.max(lock, now + 0.25); return; }
    if (Math.abs(e.deltaY) > 6) advance(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  let touch = null;
  window.addEventListener("touchstart", (e) => { startMusic(); const p = e.changedTouches[0]; touch = { x: p.clientX, y: p.clientY }; }, { passive: true });
  window.addEventListener("pointerdown", () => startMusic());
  window.addEventListener("touchend", (e) => {
    if (!touch) return;
    startMusic();
    const p = e.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    touch = null;
    if (Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx)) advance(dy < 0 ? 1 : -1);
    else if (Math.abs(dx) > 36) advance(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) advance(1);
  }, { passive: true });
  window.addEventListener("pointerup", (e) => { startMusic(); if (e.pointerType === "mouse") advance(1); });
  window.addEventListener("keydown", (e) => {
    startMusic();
    if (["ArrowDown", "ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); advance(1); }
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); advance(-1); }
  });
  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

  resize();
  const start = performance.now() / 1000;
  // #s3-40 opens step 3 at 4.0 seconds, to look at one moment
  const m = /^#s(\d+)(?:-(\d+))?$/.exec(location.hash);
  if (m) { go(+m[1] - 1, start, m[2] ? +m[2] / 10 : 0); prev = null; }
  else go(0, start);
  requestAnimationFrame(frame);
})();
</script>

</body>

/* Layout: one screen, everything drawn in code with pen, ink and coloured pencil; each step plays by itself and holds; typed words sit under the drawing. */
:root {
  --night: #141b38;   /* the paper, inked dark blue */
  --night2: #22306a;  /* lighter blue pencil */
  --night3: #090d24;  /* darkest ink */
  --ink: #efe3c4;     /* cream ink: stars, lines, words */
  --blue: #8ea6dc;    /* blue ballpoint */
  --coral: #e2775c;   /* roads */
  --sand: #c9a46a;    /* land, ochre pencil */
  --sand2: #e6cb93;
  --sea: #9cc0e6;     /* the sea bus */
  --type: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: var(--night); }
body {
  margin: 0; color: var(--ink); font-family: var(--type);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.grain { position: fixed; inset: -40%; pointer-events: none; opacity: .13; mix-blend-mode: overlay; animation: grain 1.6s steps(4) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } }
.poem {
  position: fixed; pointer-events: none; text-align: center;
  left: max(24px, calc(env(safe-area-inset-left, 0px) + 18px));
  right: max(24px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
}
.poem-top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 7vh); }
.poem p {
  margin: 0 auto; max-width: 26ch;
  font-size: clamp(19px, 5.1vw, 30px); line-height: 1.38; letter-spacing: -.01em;
  color: var(--ink); text-wrap: balance;
  text-shadow: 0 0 14px var(--night3), 0 0 2px var(--night3);
  opacity: 0; transition: opacity 1.4s ease;
}
.poem p.on { opacity: 1; }
.poem p.last { font-weight: 700; font-size: clamp(26px, 7.4vw, 44px); margin-top: .45em; }
.poem.out p { opacity: 0; transition: opacity .4s ease; }
.next {
  position: fixed; left: 50%; width: 1px; height: 22px; margin-left: -.5px; pointer-events: none;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--ink); opacity: 0; transform-origin: top; transition: opacity 1.2s ease;
}
.next.on { opacity: .45; animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@media (min-aspect-ratio: 23/20) {
  .poem { right: auto; width: 35vw; left: 5vw; bottom: 12vh; text-align: left; }
  .poem-top { bottom: auto; top: 12vh; }
  .poem-top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 7vh); }
.poem p { margin: 0; }
}
@media (prefers-reduced-motion: reduce) { .grain, .next.on { animation: none; } }
noscript { position: fixed; inset: 40% 16px auto; color: var(--ink); text-align: center; }

  function drawMaps(s, a, base = { s: 1, x: 0, y: 0 }) {
    if (!mapHi) mapHi = drawMapHi();
    const z = ease(ramp(s, 5.2, 8.0));
    const T = mapT(z), far = cams.far;
    const place = (q) => { const p = far(q); return [p[0] * T.sc + T.tx, p[1] * T.sc + T.ty]; };
    ctx.save();
    ctx.setTransform(DPR * base.s * T.sc, 0, 0, DPR * base.s * T.sc, DPR * (base.s * T.tx + base.x), DPR * (base.s * T.ty + base.y));
    ctx.globalAlpha = a * ease(ramp(s, 1.3, 2.6));
    ctx.drawImage(mapHi, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR * base.s, 0, 0, DPR * base.s, DPR * base.x, DPR * base.y);
    gatherStars(place, s, a);
    const reveal = ease(ramp(s, 2.3, 6.4));
    for (const r of ROUTES) {
      const f = r.far ? ease(ramp(s, 5.6, 8.0)) : reveal;
      if (f > 0) drawRoute(r, routeScreen(r, place), f, a);
    }
    if (base.s === 1 && s > 6.6 && s < 90) travel(place, a, performance.now() / 1000);
    cityMarks(place, a * ease(ramp(s, 1.85, 2.2)), ramp(s, 7.6, 8.0) > 0);
    ctx.restore();
  }

  // =====================================================================  the world
  let globeProj = null, globeImg = null;
  function buildGlobe() {
    const R = wide ? Math.min(H * 0.36, W * 0.25) : Math.min((W - 56) / 2, H * 0.22);
    const gx = wide ? W * 0.64 : W / 2, gy = wide ? H * 0.47 : H * 0.48;
    globeProj = d3.geoOrthographic().rotate([-29, -22]).scale(R).translate([gx, gy]).precision(0.3);
    const [c, x] = layer();
    const path = d3.geoPath(globeProj, x);
    const box = [gx - R, gy - R, gx + R, gy + R];
    x.beginPath(); x.arc(gx, gy, R, 0, TAU); x.fillStyle = rgba(C.night3, 0.85); x.fill();
    x.save();
    x.beginPath(); x.arc(gx, gy, R, 0, TAU); x.clip();
    hatch(x, box, { seed: 31, angle: -0.95, gap: 3.4, len: [6, 16], space: 5, width: 0.9, colors: [C.night2], alpha: [0.35, 0.55] });
    x.beginPath(); path(d3.geoGraticule10()); x.strokeStyle = rgba(C.blue, 0.2); x.lineWidth = 0.6; x.stroke();
    x.save();
    x.beginPath(); path(LAND); x.clip();
    hatch(x, box, { seed: 32, angle: 0.8, gap: 2.2, len: [4, 10], space: 3, width: 0.9, colors: [C.sand], alpha: [0.3, 0.45, 0.6] });
    x.restore();
    x.beginPath(); path(LAND); x.strokeStyle = rgba(C.ink, 0.55); x.lineWidth = 0.7; x.stroke();
    // the night side, cross-hatched
    x.beginPath(); x.rect(gx - R * 2, gy - R * 2, R * 4, R * 4); x.arc(gx - R * 0.42, gy - R * 0.32, R * 1.12, 0, TAU); x.clip("evenodd");
    hatch(x, box, { seed: 33, angle: 0.5, gap: 2.3, len: [6, 14], space: 2, width: 1, colors: [C.night3], alpha: [0.45, 0.7] });
    hatch(x, box, { seed: 34, angle: -0.6, gap: 3.2, len: [6, 14], space: 3, width: 1, colors: [C.night3], alpha: [0.35, 0.55] });
    x.restore();
    const rim = [];
    for (let i = 0; i <= 120; i++) { const a = (i / 120) * TAU; rim.push([gx + Math.cos(a) * R, gy + Math.sin(a) * R]); }
    pen(x, rim, { color: C.ink, width: 1.2, alpha: 0.85, amp: 0.7, seed: 4 });
    globeImg = c;
  }
  function drawLap(p, home, a) {
    const center = globeProj.invert(globeProj.translate());
    const end = 29 + 360 * p;
    let seg = [], vis = null;
    const flush = () => {
      if (seg.length > 1) pen(ctx, seg, vis ? { color: C.ink, width: 1.8, alpha: a, amp: 0.6, seed: 11 } : { color: C.ink, width: 1, alpha: 0.4 * a, amp: 0.4, seed: 12, passes: 1, dash: [3, 5] });
      seg = seg.length ? [seg[seg.length - 1]] : [];
    };
    for (let lon = 29; lon <= end + 1e-6; lon += 1.5) {
      const q = [Math.min(lon, end), 41.01];
      const v = d3.geoDistance(q, center) < Math.PI / 2;
      if (vis !== null && v !== vis) flush();
      vis = v;
      seg.push(globeProj(q));
    }
    flush();
    if (p < 1 && p > 0) { const q = [end, 41.01]; if (d3.geoDistance(q, center) < Math.PI / 2) { const h = globeProj(q); ctx.fillStyle = rgba(C.ink, a); ctx.beginPath(); ctx.arc(h[0], h[1], 2.4, 0, TAU); ctx.fill(); } }
    if (home > 0) {
      const ip = d3.geoInterpolate(ll("istanbul"), ll("izmir"));
      const pts = [];
      for (let i = 0; i <= 20; i++) pts.push(globeProj(ip(i / 20)));
      pen(ctx, pts, { color: C.coral, width: 2, alpha: a, amp: 0.4, seed: 13, frac: home });
      const z = globeProj(ll("izmir"));
      ctx.strokeStyle = rgba(C.coral, a * ease(ramp(home, 0.8, 1))); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(z[0], z[1], 3.5, 0, TAU); ctx.stroke();
    }
  }

  // =====================================================================  the steps
  const KM = fmt(D.totalKm);
  const STEPS = [
    { scene: "sky", dur: 6.5, lines: [["Bazı geceler diğerlerinden daha karanlık.", 4.4]] },
    { scene: "map", dur: 9.6, lines: [[`${KM} kilometre.`, 8.3]] },
    { scene: "globe", dur: 8.2, lines: [[`${KM} kilometre.`, 0, "", "top"], ["Dünyanın çevresini dolaşmaya yeter.", 4.5, "", "top"], ["Dönüp dolaşıp yine seni bulacaksam,", 5.6], ["bu mesafe katetmeye değer.", 6.7]] },
    { scene: "end", dur: 7.8, lines: [["Gökyüzüme yeni yıldızlar kattığın için teşekkür ederim.", 4.4], ["İyi ki doğdun.", 6.4, "last"]], dur2: 7.8 },
  ];
  const XF = 1.2; // crossfade between scenes, seconds

  function scene(name, s, now, a) {
    if (a <= 0) return;
    skyRot = name === "sky" || name === "end" ? (reduce ? 0 : s * 0.0045) : 0;
    if (name === "sky") drawSky(now, a * ease(ramp(s, 0, 1.4)), cityStars, ease(ramp(s, 2.4, 4.0)), ramp(s, 0.3, 2.6));
    else if (name === "map") drawMaps(s, a);
    else if (name === "globe") {
      // the map pulls back until it is a small part of the world
      const g = ease(ramp(s, 0, 2.0));
      const F = cams.far, A = F(ll("istanbul")), B = F(ll("maras")), GA = globeProj(ll("istanbul")), GB = globeProj(ll("maras"));
      const k2 = Math.hypot(GB[0] - GA[0], GB[1] - GA[1]) / Math.hypot(B[0] - A[0], B[1] - A[1]);
      const anchor = [lerp(A[0], GA[0], g), lerp(A[1], GA[1], g)];
      if (g < 1) {
        const sf = Math.exp(lerp(0, Math.log(k2), g));
        drawMaps(99, a * (1 - ramp(g, 0.08, 0.42)), { s: sf, x: anchor[0] - sf * A[0], y: anchor[1] - sf * A[1] });
      }
      const sg = Math.exp(lerp(Math.log(1 / k2), 0, g));
      ctx.save();
      ctx.globalAlpha = a * ramp(g, 0.04, 0.38);
      ctx.setTransform(DPR * sg, 0, 0, DPR * sg, DPR * (anchor[0] - sg * GA[0]), DPR * (anchor[1] - sg * GA[1]));
      ctx.drawImage(globeImg, 0, 0, W, H);
      ctx.restore();
      drawLap(ease(ramp(s, 2.1, 4.6)), ease(ramp(s, 4.7, 5.4)), a);
      if (s > 5.6 && !reduce) {
        const center = globeProj.invert(globeProj.translate());
        for (let j = 0; j < 14; j++) {
          const lon = 29 + (((s - 5.6) / 7) * 360 - j * 1.6), q = [lon, 41.01];
          if (d3.geoDistance(q, center) >= Math.PI / 2) continue;
          const h = globeProj(q);
          ctx.fillStyle = rgba(j ? C.ink : [255, 250, 235], a * ramp(s, 5.6, 6.2) * (j ? 0.55 * (1 - j / 14) : 1));
          ctx.beginPath(); ctx.arc(h[0], h[1], j ? 1.5 : 2.6, 0, TAU); ctx.fill();
        }
        const z = globeProj(ll("izmir")), br = 3.5 + 2.5 * (0.5 + 0.5 * Math.sin(s * 2.2));
        ctx.strokeStyle = rgba(C.coral, a * 0.6); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(z[0], z[1], br, 0, TAU); ctx.stroke();
      }
    } else if (name === "end") {
      // the places leave the world and go back to the stars they came from
      if (!gather) pickGather();
      drawSky(now, a * ease(ramp(s, 0.7, 1.9)), cityStars, 0, 1, { list: newStars, a: a * ease(ramp(s, 2.0, 2.6)), reveal: ramp(s, 2.1, 5.0) });
      const back = ease(ramp(s, 0.15, 1.8)), fade = 1 - ramp(s, 1.7, 2.1);
      if (fade > 0) for (const g of gather) {
        const q = globeProj(ll(g.k));
        starMark(lerp(q[0], g.st.px, back), lerp(q[1], g.st.py, back), a * fade, lerp(0.8, 1.25, back));
      }
    }
  }

  const poem = $("#poem"), poemTop = $("#poemTop"), next = $("#next");
  let step = -1, prev = null, prevAge = 0, t0 = 0, switched = 0, swap = null, lineEls = [], gatherRot = 0;
  function go(i, now, at = 0) {
    i = i >= STEPS.length ? 0 : clamp(i, 0, STEPS.length - 1);
    if (i === step) return;
    prev = step >= 0 ? STEPS[step].scene : null;
    // the scene being left keeps its own clock while it fades, so nothing jumps
    prevAge = step >= 0 ? now - t0 : 0;
    if (prev === "sky") gatherRot = reduce ? 0 : prevAge * 0.0045;
    switched = now;
    step = i;
    t0 = now - at;
    poem.classList.add("out"); poemTop.classList.add("out");
    swap = { at: now + (lineEls.length ? 0.4 : 0) };
    next.classList.remove("on");
  }
  function updatePoem(now) {
    const S = STEPS[step];
    if (swap && now >= swap.at) {
      poem.classList.remove("out"); poemTop.classList.remove("out");
      poem.textContent = ""; poemTop.textContent = "";
      // over the park the words sit just above the trees
      poem.style.bottom = S.scene === "sky" || S.scene === "end" ? `${Math.round(H - treeTop + 14)}px` : "";
      lineEls = S.lines.map(([text, at, cls, where]) => {
        const p = document.createElement("p");
        p.textContent = text;
        if (cls) p.className = cls;
        (where === "top" ? poemTop : poem).appendChild(p);
        return { el: p, due: t0 + (reduce ? 0 : at) };
      });
      swap = null;
    }
    for (const l of lineEls) if (now >= l.due) l.el.classList.add("on");
    next.classList.toggle("on", now - t0 >= (reduce ? 0.5 : S.dur));
  }

  function render(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    const s = reduce ? 99 : now - t0;
    const cur = STEPS[step].scene;
    // the near map and the far map are one drawing: no crossfade between them
    const joined = prev === "map" && cur === "globe";
    const k = prev && !joined ? ease(clamp((now - switched) / XF)) : 1;
    if (k < 1) scene(prev, prevAge + (now - switched), now, 1 - k);
    scene(cur, s, now, k);
  }

  function resize() {
    gather = null;
    sprites = new Map();
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    wide = W > H * 1.15;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    buildBackground();
    layoutSky();
    cams = { near: camFor([22.8, 36.3, 39.8, 43.0]), far: camFor([0.8, 35.2, 45.0, 44.6]) };
    mapHi = null;
    mapScale();
    buildGlobe();
  }
  (function grain() {
    const g = document.createElement("canvas");
    g.width = g.height = 160;
    const c = g.getContext("2d"), img = c.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    c.putImageData(img, 0, 0);
    $("#grain").style.backgroundImage = `url(${g.toDataURL()})`;
  })();

  function frame(ms) {
    const now = ms / 1000;
    updatePoem(now);
    render(now);
    requestAnimationFrame(frame);
  }

  // =====================================================================  music
  // a music box over a soft pad, D major, played live; it starts on the first touch
  let audio = null;
  function startMusic() {
    if (audio) { if (audio.ac.state === "suspended") audio.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain();
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 4);
    master.connect(ac.destination);
    const rev = ac.createConvolver(), len = Math.floor(ac.sampleRate * 3.4);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
    rev.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.6; rev.connect(wet); wet.connect(master);
    const dry = ac.createGain(); dry.gain.value = 0.55; dry.connect(master);
    const bus = ac.createGain(); bus.connect(dry); bus.connect(rev);
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // a soft piano: a few slightly stretched partials, two strings a hair apart, a felt-hammer onset
    function piano(m, t, g) {
      const f0 = hz(m), lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(Math.min(9000, f0 * 9), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(400, f0 * 2.2), t + 2.5);
      lp.connect(bus);
      const amps = [1, 0.42, 0.26, 0.14, 0.08, 0.05], decay = 2.6 + 3.5 * Math.max(0, (72 - m) / 30);
      amps.forEach((amp, i) => {
        const nth = i + 1, f = f0 * nth * Math.sqrt(1 + 0.00035 * nth * nth);
        [-1.5, 1.5].forEach((det) => {
          const o = ac.createOscillator(), e = ac.createGain();
          o.type = "sine"; o.frequency.value = f; o.detune.value = det;
          e.gain.setValueAtTime(0, t);
          e.gain.linearRampToValueAtTime((g * amp) / 2, t + 0.008);
          e.gain.exponentialRampToValueAtTime(0.0001, t + decay / Math.pow(nth, 0.7));
          o.connect(e); e.connect(lp); o.start(t); o.stop(t + decay + 0.1);
        });
      });
    }
    // D, Bm, G, A, then D, F#m, G, A
    const CH = [[50, 54, 57], [47, 50, 54], [43, 47, 50], [45, 49, 52], [50, 54, 57], [42, 45, 49], [43, 47, 50], [45, 49, 52]];
    const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83];
    const beat = 0.62, rnd = rng(77);
    let next = ac.currentTime + 0.3, n = 0, last = 66;
    function schedule() {
      while (next < ac.currentTime + 0.5) {
        const bar = Math.floor(n / 8), chord = CH[bar % CH.length], pos = n % 8;
        // left hand: a low root, then the chord broken gently upward
        if (pos === 0) piano(chord[0] - 12, next, 0.2);
        if (pos === 2) piano(chord[1], next, 0.1);
        if (pos === 4) piano(chord[2], next, 0.1);
        if (pos === 6) piano(chord[1] + 12, next, 0.08);
        const busy = 0.35 + 0.08 * Math.max(0, step);
        if (rnd() < (pos % 2 ? busy * 0.6 : busy)) {
          // walk the melody near the last note, leaning on the chord
          const tones = SCALE.filter((m) => Math.abs(m - last) <= 5 && m !== last);
          let m = tones[Math.floor(rnd() * tones.length)] || 69;
          if (pos === 0) m = chord.map((c) => c + 24).reduce((a, c) => (Math.abs(c - last) < Math.abs(a - last) ? c : a));
          last = m;
          piano(m + (step === STEPS.length - 1 && rnd() < 0.25 ? 12 : 0), next, 0.17);
        }
        next += beat; n++;
      }
    }
    const timer = setInterval(schedule, 60);
    schedule();
    document.addEventListener("visibilitychange", () => (document.hidden ? ac.suspend() : ac.resume()));
    audio = { ac, timer };
  }

  // one gesture, one step
  let lock = 0;
  function advance(dir) {
    const now = performance.now() / 1000;
    if (now < lock) return;
    if (dir > 0 && !reduce && now - t0 < STEPS[step].dur) return;
    lock = now + 0.8;
    go(step + dir, now);
  }
  window.addEventListener("wheel", (e) => {
    e.preventDefault();
    const now = performance.now() / 1000;
    if (now < lock) { lock = Math.max(lock, now + 0.25); return; }
    if (Math.abs(e.deltaY) > 6) advance(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  let touch = null;
  window.addEventListener("touchstart", (e) => { const p = e.changedTouches[0]; touch = { x: p.clientX, y: p.clientY }; }, { passive: true });
  window.addEventListener("touchend", (e) => {
    if (!touch) return;
    startMusic();
    const p = e.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    touch = null;
    if (Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx)) advance(dy < 0 ? 1 : -1);
    else if (Math.abs(dx) > 36) advance(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) advance(1);
  }, { passive: true });
  window.addEventListener("pointerup", (e) => { startMusic(); if (e.pointerType === "mouse") advance(1); });
  window.addEventListener("keydown", (e) => {
    startMusic();
    if (["ArrowDown", "ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); advance(1); }
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); advance(-1); }
  });
  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

  resize();
  const start = performance.now() / 1000;
  // #s3-40 opens step 3 at 4.0 seconds, to look at one moment
  const m = /^#s(\d+)(?:-(\d+))?$/.exec(location.hash);
  if (m) { go(+m[1] - 1, start, m[2] ? +m[2] / 10 : 0); prev = null; }
  else go(0, start);
  requestAnimationFrame(frame);
})();
</script>

</body>

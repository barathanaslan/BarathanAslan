<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barathan Aslan</title>

    <!-- The CV renders from cv.json at runtime, so it is not in this source.
         Search and link-preview crawlers rely on the metadata below. -->
    <meta name="description"
        content="Senior Computer Engineering student at Boğaziçi University, working on ML and LLM systems. CV, projects and contact — inside a Windows 98 desktop.">
    <meta name="author" content="Barathan Aslan">
    <link rel="canonical" href="https://barathanaslan.com/">

    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Barathan Aslan">
    <meta property="og:url" content="https://barathanaslan.com/">
    <meta property="og:title" content="Barathan Aslan — Computer Engineering, Boğaziçi University">
    <meta property="og:description"
        content="Senior Computer Engineering student working on ML and LLM systems. My CV, served from a Windows 98 desktop.">
    <meta property="og:image" content="https://barathanaslan.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A Windows 98 desktop with Barathan Aslan's CV open in a window.">
    <meta property="profile:first_name" content="Barathan">
    <meta property="profile:last_name" content="Aslan">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Barathan Aslan — Computer Engineering, Boğaziçi University">
    <meta name="twitter:description"
        content="Senior Computer Engineering student working on ML and LLM systems. My CV, served from a Windows 98 desktop.">
    <meta name="twitter:image" content="https://barathanaslan.com/assets/og-image.png">
    <meta name="twitter:image:alt" content="A Windows 98 desktop with Barathan Aslan's CV open in a window.">

    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#008080">

    <!-- 98.css for the retro UI -->
    <link rel="stylesheet" href="assets/98.css">
    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="apps/apps.css">
</head>

<body>
    <div class="screen-layout" id="desktop">
        <!-- Desktop icons. data-open names an app registered in app.js;
             data-href makes the icon an Internet shortcut. -->
        <div class="desktop-icons" id="desktop-icons">
            <div class="desktop-icon" tabindex="0" role="button" data-open="mycomputer">
                <span class="icon-img"><img src="assets/icons/my-computer-32.png" alt=""></span>
                <span class="icon-label">My Computer</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="mydocuments">
                <span class="icon-img"><img src="assets/icons/my-documents-32.png" alt=""></span>
                <span class="icon-label">My Documents</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="ie">
                <span class="icon-img"><img src="assets/icons/ie-32.png" alt=""></span>
                <span class="icon-label">Internet Explorer</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="recyclebin" id="recycle-bin-icon">
                <span class="icon-img"><img src="assets/icons/recycle-full-32.png" alt=""></span>
                <span class="icon-label">Recycle Bin</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="cv">
                <span class="icon-img"><img src="assets/icons/document-32.png" alt=""></span>
                <span class="icon-label">CV - Barathan Aslan.doc</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="mail">
                <span class="icon-img"><img src="assets/icons/mail-32.png" alt=""></span>
                <span class="icon-label">Send Mail</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="notepad" data-file="readme.txt">
                <span class="icon-img"><img src="assets/icons/text-file-32.png" alt=""></span>
                <span class="icon-label">readme.txt</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="minesweeper">
                <span class="icon-img shortcut"><img src="assets/icons/minesweeper-32.png" alt=""></span>
                <span class="icon-label">Minesweeper</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-open="solitaire">
                <span class="icon-img shortcut"><img src="assets/icons/solitaire-32.png" alt=""></span>
                <span class="icon-label">Solitaire</span>
            </div>
            <div class="desktop-icon" tabindex="0" role="button" data-href="https://observatory.barathanaslan.com">
                <span class="icon-img shortcut"><img src="assets/icons/internet-32.png" alt=""></span>
                <span class="icon-label">TRACE Observatory</span>
            </div>
        </div>

        <!-- CV window. Its content is rendered at runtime from cv.json by app.js. -->
        <div class="window app-window main-window wm-hidden" id="cv-window" data-icon="document">
            <div class="title-bar">
                <div class="title-bar-text">CV - Barathan Aslan.doc</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body">
                <div class="toolbar status-bar">
                    <button onclick="exportPDF()" style="font-weight: bold;">Export PDF</button>
                    <button onclick="window.open('BarathanAslanCV.pdf', '_blank')">Download PDF</button>
                    <p class="status-bar-field">Print the page, or download the PDF</p>
                </div>

                <!-- Rendered at runtime from cv.json by app.js -->
                <div class="cv-content">
                    <noscript>
                        <h1>Barathan Aslan</h1>
                        <p>Computer Engineering, Bo&#287;azi&#231;i University &mdash; &#304;stanbul, T&#252;rkiye</p>
                        <p>Senior Computer Engineering student at Bo&#287;azi&#231;i University with a fascination for
                            pattern recognition and prediction. I apply this tendency across domains, from training ML
                            and LLM models to analyzing markets.</p>
                        <p>Research Assistant at Bo&#287;azi&#231;i University &ndash; TRACE (June 2026 &ndash; present).
                            Previously Associate Data Scientist at Pegasus, AI Intern at Fimple, and Software
                            Engineering Intern at Doping Technology.</p>
                        <p>
                            <a href="mailto:barathanasln@gmail.com">barathanasln@gmail.com</a> &middot;
                            <a href="https://www.linkedin.com/in/barathanaslan/">LinkedIn</a> &middot;
                            <a href="https://github.com/barathanaslan">GitHub</a> &middot;
                            <a href="https://observatory.barathanaslan.com">TRACE Observatory</a> &middot;
                            <a href="https://presser.ink/@barathan/craving-sugar">Craving Sugar (blog)</a> &middot;
                            <a href="BarathanAslanCV.pdf">Download CV (PDF)</a>
                        </p>
                        <p><strong>This page needs JavaScript for the full interactive CV.</strong></p>
                    </noscript>
                </div>
            </div>
        </div>

        <!-- Send Mail window -->
        <div class="window app-window mail-window wm-hidden" id="mail-window" data-icon="mail">
            <div class="title-bar">
                <div class="title-bar-text">Send Mail</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body">
                <form action="https://formsubmit.co/barathanasln@gmail.com" method="POST" class="mail-form">
                    <input type="hidden" name="_subject" value="Message from CV Website">
                    <input type="hidden" name="_captcha" value="true">
                    <input type="hidden" name="_next" value="https://barathanaslan.com/">
                    <div class="mail-field">
                        <label>From:</label>
                        <input type="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="mail-field">
                        <label>Subject:</label>
                        <input type="text" name="_subject" placeholder="Subject">
                    </div>
                    <div class="mail-body-field">
                        <textarea name="message" placeholder="Write your message here..." required></textarea>
                    </div>
                    <div class="mail-toolbar">
                        <button type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Taskbar. Task buttons are added and removed by the window manager. -->
        <div class="taskbar">
            <button class="start-button" id="start-button" aria-haspopup="menu" aria-expanded="false">
                <img src="assets/icons/windows-16.png" alt="">
                <b>Start</b>
            </button>
            <div class="taskbar-divider"></div>
            <div class="taskbar-tasks" id="taskbar-tasks"></div>
            <div class="taskbar-tray" id="taskbar-tray">
                <span class="taskbar-time" id="taskbar-time">04:20 PM</span>
            </div>
        </div>
    </div>

    <!-- Clippy -->
    <div id="clippy-popup" class="clippy-popup" role="status" aria-live="polite">
        <div class="clippy-img"></div>
        <div class="clippy-bubble"></div>
    </div>

    <script defer src="app.js"></script>
    <script defer src="apps/system.js"></script>
    <script defer src="apps/network.js"></script>
    <script defer src="apps/minesweeper.js"></script>
    <script defer src="apps/solitaire.js"></script>
    <script src="print.js"></script>
</body>

</html>
